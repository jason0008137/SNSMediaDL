[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snsmediadl"
version = "0.1.0"
description = "SNS media downloader backend — ingest, dedupe, download, catalogue"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.6",
    # 格線縮圖。沒有它，一頁 60 格要傳上百 MB 的原檔。
    "Pillow>=10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["snsmediadl*"]

[tool.setuptools.package-data]
snsmediadl = ["web/*.html", "web/*.css", "web/js/*.js", "web/js/views/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: 會啟動子行程或跑 migration 的測試"]
